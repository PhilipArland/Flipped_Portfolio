<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philip Alili - Portfolio</title>
    <link rel="icon" href="assets/img/3.png" type="image/png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <!-- Navbar -->
    <nav id="navbar-placeholder" class="navbar navbar-expand-lg bg-card shadow-sm d-md-none mb-1 mb-md-3 px-2">
    </nav>

    <div class="container-fluid p-1 p-md-4">
        <div class="row gx-3">
            <div class="col-md-3 d-none d-md-block my-sidebar">
                <div id="sidebar-placeholder" class="sidebar card rounded-4 border-0 d-flex justify-content-between">
                </div>
            </div>

            <div class="col-md-9 my-home">
                <div class="row gx-3">
                    <div class="col-md-9 exp-middle" id="experience-details"></div>

                    <div class="col-md-3 exp-right">
                        <div class="card shadow-sm rounded-4 border-0 p-3 p-md-4 mb-2 mb-md-3">
                            <h5 class="fw-semibold mb-3">
                                <i class="fas fa-user-tie me-2 text-purple"></i> Work Experience
                            </h5>

                            <button class="btn w-100 mb-2 text-start work-exp-btn" id="btn-spinnaker"
                                onclick="setExperience('spinnaker')">
                                <div class="d-flex align-items-start mb-1">
                                    <img src="assets/img/spinnaker.png" alt="Spinnaker Logo" width="40" height="40"
                                        class="me-3">

                                    <div class="lh-sm">
                                        <h6 class="mb-0 fw-semibold">Website Developer</h6>
                                        <small class="d-block">Spinnaker Global Services</small>
                                        <small class="d-block">Puerto Princesa City, Palawan</small>
                                        <small class="d-block text-muted">
                                            <i class="fas fa-calendar me-1"></i>
                                            Oct 2025 - Present
                                        </small>
                                    </div>
                                </div>
                            </button>

                            <button class="btn w-100 text-dark mb-2 text-start work-exp-btn" id="btn-pho"
                                onclick="setExperience('pho')">
                                <div class="d-flex align-items-start mb-1">
                                    <img src="assets/img/pho.png" alt="PHO Logo" width="40" height="40" class="me-3">
                                    <div class="lh-sm ls-1">
                                        <h6 class="mb-0 fw-semibold">On-the-Job Training</h6>
                                        <small class="d-block">Provincial Health Office</small>
                                        <small class="d-block">Puerto Princesa City, Palawan</small>
                                        <small class="d-block text-muted">
                                            <i class="fas fa-calendar me-1"></i>
                                            Feb 2025 - Apr 2025
                                        </small>
                                    </div>
                                </div>
                            </button>
                            <small class="text-muted d-block mb-2 text-center">
                                Click an experience to view details
                            </small>
                        </div>

                        <div class="card shadow-sm rounded-4 border-0 p-3 p-md-4">
                            <h5 class="fw-semibold mb-3">
                                <i class="fa-solid fa-paper-plane me-2 text-purple"></i>
                                Get in Touch
                            </h5>

                            <div class="d-flex justify-content-center gap-4 fs-3 mb-2 mb-md-3">
                                <a href="mailto:philiparland@gmail.com" class="text-secondary">
                                    <i class="fa-solid fa-envelope"></i>
                                </a>

                                <a href="https://www.facebook.com/philiparland" target="_blank" class="text-secondary">
                                    <i class="fa-brands fa-facebook"></i>
                                </a>

                                <a href="https://www.instagram.com/dumb.flip" target="_blank" class="text-secondary">
                                    <i class="fa-brands fa-instagram"></i>
                                </a>

                                <a href="https://github.com/PhilipArland" target="_blank" class="text-secondary">
                                    <i class="fa-brands fa-github"></i>
                                </a>

                                <a href="https://www.linkedin.com/in/philip-arland-383260370" target="_blank"
                                    class="text-secondary">
                                    <i class="fa-brands fa-linkedin"></i>
                                </a>
                            </div>

                            <p class="text-muted small text-center">
                                Thanks for stopping by. Feel free to reach out anytime.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Cert Modal -->
    <div class="modal fade" id="certModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <img src="assets/img/certificates/responsive-web-design.png" class="img-fluid rounded"
                        alt="Certificate">
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="certModal1" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <img src="assets/img/certificates/data-analysis-with-python.png" class="img-fluid rounded"
                        alt="Certificate">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/project.js"></script>

</body>

</html>
